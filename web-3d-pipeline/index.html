<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D produkta skats</title>
  <meta name="description" content="Interaktīvs 3D produkta skats ar AR, ēnām un grozāmā galda kontrolēm.">
  <!-- Dekoderi saspiestai ģeometrijai: jākonfigurē PIRMS model-viewer ielādes -->
  <script>
    self.ModelViewerElement = self.ModelViewerElement || {};
    self.ModelViewerElement.meshoptDecoderLocation =
      'https://cdn.jsdelivr.net/npm/meshoptimizer@0.21.0/meshopt_decoder.js';
    // Draco dekoderis pēc noklusējuma ielādējas no Google gstatic CDN.
  </script>
  <!-- Google <model-viewer> (Apache-2.0) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1b1d22;
      --muted: #6b7280;
      --line: #e3e5ea;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317;
        --card: #1a1d23;
        --text: #eceef2;
        --muted: #9aa1ad;
        --line: #2a2e36;
        --accent: #3b82f6;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 16px 48px;
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
      gap: 24px;
    }
    @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }

    .viewer-card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      align-self: start;
    }
    model-viewer {
      width: 100%;
      height: min(70vh, 620px);
      min-height: 360px;
      background: radial-gradient(circle at 50% 40%, var(--card), var(--bg));
      --poster-color: transparent;
      --progress-bar-color: var(--accent);
    }
    model-viewer:focus { outline: none; }

    /* AR poga (rādās tikai, ja ierīce atbalsta AR) */
    .ar-btn {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      font: 600 15px/1 inherit;
      box-shadow: 0 6px 20px rgba(0,0,0,.18);
      cursor: pointer;
    }
    .ar-hint {
      position: absolute;
      top: 12px; left: 12px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .drop-overlay {
      position: absolute; inset: 0;
      display: none;
      align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      border: 3px dashed var(--accent);
      border-radius: var(--radius);
      font-weight: 600;
      pointer-events: none;
    }
    .viewer-card.dragging .drop-overlay { display: flex; }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    h1 { font-size: 1.5rem; margin: 0; }
    .price { font-size: 1.25rem; font-weight: 700; }
    .muted { color: var(--muted); font-size: .9rem; margin: 0; }

    .group { display: flex; flex-direction: column; gap: 10px; }
    .group-title { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    button.ctl {
      flex: 1 1 auto;
      min-height: 42px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font: 500 14px/1.2 inherit;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    button.ctl:hover { border-color: var(--accent); }
    button.ctl[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .switch {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; font-size: .95rem;
    }
    .switch input {
      appearance: none;
      position: relative;
      width: 44px; height: 24px;
      margin: 0;
      border-radius: 999px;
      background: var(--line);
      cursor: pointer;
      transition: background .2s;
    }
    .switch input::after {
      content: "";
      position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
      transition: transform .2s;
    }
    .switch input:checked { background: var(--accent); }
    .switch input:checked::after { transform: translateX(20px); }
    .switch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    label.slider { display: grid; gap: 4px; font-size: .9rem; }
    label.slider span { display: flex; justify-content: space-between; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .file-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .file-row input { font-size: .85rem; max-width: 100%; }
    .stats { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="viewer-card" id="viewerCard">
      <model-viewer
        id="viewer"
        src="models/model.web.glb"
        alt="Produkta 3D modelis"
        camera-controls
        touch-action="pan-y"
        auto-rotate
        auto-rotate-delay="1500"
        rotation-per-second="30deg"
        interaction-prompt="auto"
        shadow-intensity="1"
        shadow-softness="0.8"
        exposure="1"
        environment-image="neutral"
        camera-orbit="30deg 75deg auto"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="auto"
        ar-placement="floor"
        loading="eager">
        <button slot="ar-button" class="ar-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/></svg>
          Skatīties telpā (AR)
        </button>
      </model-viewer>
      <div class="ar-hint" id="arHint" hidden>AR pieejams mobilajā ierīcē (Android / iOS)</div>
      <div class="drop-overlay">Nomet .glb failu šeit</div>
    </section>

    <aside class="panel">
      <div>
        <h1>Produkta nosaukums</h1>
        <p class="price">€ 49,00</p>
        <p class="muted">Groziet modeli ar peli vai pirkstu, tuviniet ar ritenīti / divu pirkstu kustību.</p>
      </div>

      <div class="group">
        <div class="group-title">Skats</div>
        <div class="switch">
          <span>Auto-rotācija</span>
          <input type="checkbox" id="autoRotate" checked role="switch">
        </div>
        <div class="switch">
          <span>Ēnas</span>
          <input type="checkbox" id="shadows" checked role="switch">
        </div>
      </div>

      <div class="group">
        <div class="group-title">Grozāmais galds</div>
        <div class="row">
          <button class="ctl" id="rotLeft" type="button" title="Pagriezt pa kreisi 45°">⟲ 45°</button>
          <button class="ctl" id="playPause" type="button" aria-pressed="true">⏸ Pauze</button>
          <button class="ctl" id="rotRight" type="button" title="Pagriezt pa labi 45°">45° ⟳</button>
        </div>
        <div class="row" role="group" aria-label="Virziens">
          <button class="ctl" id="dirCw" type="button" aria-pressed="true">Pulksteņrādītāja virzienā</button>
          <button class="ctl" id="dirCcw" type="button" aria-pressed="false">Pretēji</button>
        </div>
        <label class="slider">
          <span>Ātrums <output id="speedOut">30°/s</output></span>
          <input type="range" id="speed" min="5" max="120" step="5" value="30">
        </label>
        <label class="slider">
          <span>Leņķis (augstums) <output id="tiltOut">75°</output></span>
          <input type="range" id="tilt" min="20" max="100" step="1" value="75">
        </label>
        <div class="row">
          <button class="ctl" data-view="0" type="button">Priekša</button>
          <button class="ctl" data-view="90" type="button">Sāns</button>
          <button class="ctl" data-view="180" type="button">Aizmugure</button>
          <button class="ctl" id="reset" type="button">Atiestatīt</button>
        </div>
      </div>

      <div class="group">
        <div class="group-title">Testēšana</div>
        <div class="file-row">
          <input type="file" id="fileInput" accept=".glb,.gltf,model/gltf-binary">
        </div>
        <div class="stats" id="stats">Ielādē modeli…</div>
      </div>
    </aside>
  </main>

  <script type="module">
    const viewer   = document.getElementById('viewer');
    const card     = document.getElementById('viewerCard');
    const $        = (id) => document.getElementById(id);

    // ?src=cels/uz/modeli.glb  - ļauj testēt citu modeli bez HTML labošanas
    const params = new URLSearchParams(location.search);
    if (params.get('src')) viewer.src = params.get('src');

    let direction = 1;   // 1 = pulksteņrādītāja virzienā, -1 = pretēji
    let speed = 30;      // grādi sekundē

    const applyRotation = () => {
      viewer.rotationPerSecond = `${direction * speed}deg`;
    };

    // --- auto-rotācija
    const setAutoRotate = (on) => {
      viewer.autoRotate = on;
      $('autoRotate').checked = on;
      $('playPause').setAttribute('aria-pressed', String(on));
      $('playPause').textContent = on ? '⏸ Pauze' : '▶ Griezt';
    };
    $('autoRotate').addEventListener('change', (e) => setAutoRotate(e.target.checked));
    $('playPause').addEventListener('click', () => setAutoRotate(!viewer.autoRotate));

    // --- ēnas
    $('shadows').addEventListener('change', (e) => {
      viewer.shadowIntensity = e.target.checked ? 1 : 0;
    });

    // --- virziens un ātrums
    const setDir = (d) => {
      direction = d;
      $('dirCw').setAttribute('aria-pressed', String(d === 1));
      $('dirCcw').setAttribute('aria-pressed', String(d === -1));
      applyRotation();
    };
    $('dirCw').addEventListener('click', () => setDir(1));
    $('dirCcw').addEventListener('click', () => setDir(-1));
    $('speed').addEventListener('input', (e) => {
      speed = Number(e.target.value);
      $('speedOut').textContent = `${speed}°/s`;
      applyRotation();
    });

    // --- kameras orbītas palīgfunkcijas
    const getOrbit = () => {
      const o = viewer.getCameraOrbit(); // radiāni + metri
      return {
        theta: o.theta * 180 / Math.PI,
        phi:   o.phi * 180 / Math.PI,
        radius: o.radius
      };
    };
    const setOrbit = (theta, phi) => {
      viewer.cameraOrbit = `${theta}deg ${phi}deg auto`;
    };

    $('rotLeft').addEventListener('click', () => {
      const o = getOrbit(); setOrbit(o.theta - 45, o.phi);
    });
    $('rotRight').addEventListener('click', () => {
      const o = getOrbit(); setOrbit(o.theta + 45, o.phi);
    });
    $('tilt').addEventListener('input', (e) => {
      const phi = Number(e.target.value);
      $('tiltOut').textContent = `${phi}°`;
      setOrbit(getOrbit().theta, phi);
    });
    document.querySelectorAll('[data-view]').forEach((btn) => {
      btn.addEventListener('click', () => {
        setAutoRotate(false);
        setOrbit(Number(btn.dataset.view), Number($('tilt').value));
      });
    });
    $('reset').addEventListener('click', () => {
      $('tilt').value = 75; $('tiltOut').textContent = '75°';
      $('speed').value = 30; speed = 30; $('speedOut').textContent = '30°/s';
      setDir(1);
      viewer.cameraOrbit = '30deg 75deg auto';
      viewer.fieldOfView = 'auto';
      viewer.resetTurntableRotation?.(0);
      setAutoRotate(true);
    });

    // --- AR atbalsta paziņojums
    // Draco ģeometrija var tikt atkodēta nedaudz pēc 'load' - tāpēc izmērus pārbauda atkārtoti
    const showDimensions = (tries = 20) => {
      const dim = viewer.getDimensions();
      if (dim.x + dim.y + dim.z === 0 && tries > 0) {
        setTimeout(() => showDimensions(tries - 1), 250);
        return;
      }
      $('stats').textContent =
        `Izmēri: ${(dim.x * 100).toFixed(1)} × ${(dim.y * 100).toFixed(1)} × ${(dim.z * 100).toFixed(1)} cm`;
    };
    viewer.addEventListener('load', () => {
      $('arHint').hidden = viewer.canActivateAR;
      showDimensions();
    });
    viewer.addEventListener('error', () => {
      $('stats').textContent =
        'Modeli neizdevās ielādēt. Pārbaudi ceļu (models/model.web.glb) vai izvēlies failu zemāk.';
    });

    // --- lokāla faila ielāde (izvēle vai drag & drop)
    let objectUrl = null;
    const loadFile = (file) => {
      if (!file || !/\.(glb|gltf)$/i.test(file.name)) return;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      viewer.src = objectUrl;
      $('stats').textContent = `Ielādē ${file.name} (${(file.size / 1024).toFixed(0)} KB)…`;
    };
    $('fileInput').addEventListener('change', (e) => loadFile(e.target.files[0]));
    card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('dragging'); });
    card.addEventListener('dragleave', () => card.classList.remove('dragging'));
    card.addEventListener('drop', (e) => {
      e.preventDefault();
      card.classList.remove('dragging');
      loadFile(e.dataTransfer.files[0]);
    });

    applyRotation();
  </script>
</body>
</html>
